name: QA Periodic Run

on:
  schedule:
    - cron: '0 6 * * 1,3,5'
  workflow_dispatch:
    inputs:
      tier:
        description: 'Test tier (sanity, full-qa, release, custom)'
        default: sanity
        type: choice
        options: [sanity, full-qa, release, custom]
      test_types:
        description: 'Comma-separated for custom tier: unit,component,api-contract,sse,security'
        default: unit,component,api-contract
        type: string
  pull_request:
    paths: ['app/agentic-console/**', '__tests__/agentic-console/**', 'qa-dashboard/agentic-console/**']
    branches: [develop]

permissions:
  contents: write
  issues: write
  pull-requests: read

env:
  NODE_VERSION: '20'

jobs:
  qa-periodic:
    name: QA Periodic — Agentic Console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'npm' }

      - name: Install dependencies
        run: npm ci

      - name: Ensure directories
        run: mkdir -p qa-dashboard/projects/agentic-console __tests__/agentic-console

      - name: Run QA tests
        id: tests
        continue-on-error: true
        env:
          CI: 'true'
        run: |
          echo "::group::Running QA tests"
          npx vitest run __tests__/agentic-console/ --reporter=json --outputFile=qa-dashboard/vitest-output.json > qa-dashboard/projects/agentic-console/last-run.json 2>&1 || true
          echo "::endgroup::"

      - name: Parse and update results (per-project)
        id: parse
        run: |
          PROJECT_DIR="qa-dashboard/projects/agentic-console"
          RESULTS_FILE="${PROJECT_DIR}/vitest-output.json"
          OUTPUT="${PROJECT_DIR}/results.json"
          HISTORY="${PROJECT_DIR}/run-history.json"
          TS=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          RID="run-$(date -u +"%Y%m%d-%H%M%S")"

          TRIGGER="ci-pipeline"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TRIGGER="manual:${{ github.actor }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            TRIGGER="pr:${{ github.event.pull_request.number }}"
          fi

          TOTAL=0; PASSED=0; FAILED=0
          if [ -f "$RESULTS_FILE" ]; then
            TOTAL=$(python3 -c "import json; d=json.load(open('$RESULTS_FILE')); print(d.get('numTotalTests',0))" 2>/dev/null || echo 0)
            PASSED=$(python3 -c "import json; d=json.load(open('$RESULTS_FILE')); print(d.get('numPassedTests',0))" 2>/dev/null || echo 0)
            FAILED=$(python3 -c "import json; d=json.load(open('$RESULTS_FILE')); print(d.get('numFailedTests',0))" 2>/dev/null || echo 0)
          fi

          PASS_RATE=$(python3 -c "print(round(($PASSED/$TOTAL)*100,1))" 2>/dev/null || echo 0)
          echo "pass_rate=$PASS_RATE" >> $GITHUB_OUTPUT
          echo "total=$TOTAL passed=$PASSED failed=$FAILED rate=$PASS_RATE%"

          python3 << PYEOF
          import json, os
          results_path = "$OUTPUT"
          history_path = "$HISTORY"
          ts = "$TS"
          rid = "$RID"
          trigger = "$TRIGGER"
          total = int("$TOTAL" or 0)
          passed = int("$PASSED" or 0)
          failed = int("$FAILED" or 0)
          pass_rate = float("$PASS_RATE" or 0)

          os.makedirs(os.path.dirname(results_path), exist_ok=True)

          existing = {}
          if os.path.exists(results_path):
              with open(results_path) as f:
                  try: existing = json.load(f)
                  except: pass

          # Layer breakdown from vitest results
          layers = {}
          vitest_file = "$RESULTS_FILE"
          if os.path.exists(vitest_file):
              try:
                  vdata = json.load(open(vitest_file))
                  for result in vdata.get('testResults', []):
                      fname = result.get('name', '')
                      if '/unit/' in fname: layer = 'unit'
                      elif '/comp/' in fname: layer = 'component'
                      elif '/api/' in fname: layer = 'api-contract'
                      elif '/sse/' in fname: layer = 'sse'
                      elif '/security/' in fname: layer = 'security'
                      else: layer = 'unknown'
                      l = layers.setdefault(layer, {'total':0,'passed':0,'failed':0})
                      l['total'] += 1
                      if result.get('status') == 'passed': l['passed'] += 1
                      else: l['failed'] += 1
              except: pass

          testTypes = existing.get('testTypes', [])
          for tid, tinfo in [('unit','Unit'),('component','Component'),('api-contract','API Contract'),('sse','SSE'),('security','Security')]:
              existing_t = next((t for t in testTypes if t.get('id') == tid), None)
              if existing_t:
                  if tid in layers:
                      existing_t['total'] = layers[tid]['total']
                      existing_t['passed'] = layers[tid]['passed']
                      existing_t['failed'] = layers[tid]['failed']
                      existing_t['status'] = 'implemented' if layers[tid]['total'] > 0 else 'not-implemented'
              elif tid in layers and layers[tid]['total'] > 0:
                  testTypes.append({'id': tid, 'name': tinfo, 'status': 'implemented', 'total': layers[tid]['total'], 'passed': layers[tid]['passed'], 'failed': layers[tid]['failed']})

          summary = {
              "totalTests": total, "passed": passed, "failed": failed,
              "blocked": 0, "passRate": pass_rate,
              "coveragePct": existing.get("summary", {}).get("coveragePct", 0),
              "durationMs": 0,
              "testTypesImplemented": sum(1 for t in testTypes if t.get('status') == 'implemented'),
              "testTypesTotal": 8,
              "qualityGatesPassed": existing.get("summary", {}).get("qualityGatesPassed", 0),
              "qualityGatesTotal": existing.get("summary", {}).get("qualityGatesTotal", 10),
          }

          trend = existing.get("trend", {"passRate": [], "totalTests": [], "dates": []})
          trend["passRate"] = (trend["passRate"] + [pass_rate])[-20:]
          trend["totalTests"] = (trend["totalTests"] + [total])[-20:]
          trend["dates"] = (trend["dates"] + [ts[:10]])[-20:]

          updated = {
              "version": "2.0", "product": "agentic-console", "lastUpdated": ts,
              "summary": summary, "testTypes": testTypes,
              "qualityGates": existing.get("qualityGates", []),
              "trend": trend,
          }

          with open(results_path, "w") as f:
              json.dump(updated, f, indent=2)

          # Run history
          tier_input = "${{ inputs.tier || 'full'}}"
          entry = {
              "runId": rid, "tier": tier_input,
              "tierLabel": tier_input.capitalize(),
              "status": "passed" if failed == 0 else "failed",
              "started": ts, "completed": ts,
              "allPassed": failed == 0,
              "summary": {"total": total, "passed": passed, "failed": failed, "passRate": pass_rate, "durationMs": 0, "newDefects": 0},
              "metadata": {"triggeredBy": trigger, "commitSha": "${{ github.sha }}", "branch": "${{ github.ref_name }}", "durationMs": 0},
              "source": "ci-pipeline", "defectsFound": [],
          }

          history = []
          if os.path.exists(history_path):
              with open(history_path) as f:
                  try: history = json.load(f)
                  except: pass
          history.append(entry)
          with open(history_path, "w") as f:
              json.dump(history[-50:], f, indent=2)

          print(f"Updated per-project results: {total} tests, {pass_rate}% pass rate")
          PYEOF

      - name: Collect test results (general dashboard)
        run: node scripts/collect-test-results.js
        env:
          CI: 'true'

      - name: Check pass rate threshold
        id: threshold
        run: |
          echo "rate=${{ steps.parse.outputs.pass_rate }}" >> $GITHUB_OUTPUT
          RATE=${{ steps.parse.outputs.pass_rate }}
          if (( $(echo "$RATE < 80" | bc -l) )); then
            echo "below=true" >> $GITHUB_OUTPUT
            echo "PASS RATE $RATE% IS BELOW 80% — creating issue"
          else
            echo "below=false" >> $GITHUB_OUTPUT
            echo "Pass rate $RATE% is acceptable"
          fi

      - name: Commit results
        if: github.event_name != 'pull_request'
        run: |
          git config user.email "qa-bot@petemart.ai"
          git config user.name "QA Bot"
          git add qa-dashboard/projects/agentic-console/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(qa): periodic test run results [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Create GitHub Issue on low pass rate
        if: steps.threshold.outputs.below == 'true' && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const rate = '${{ steps.parse.outputs.pass_rate }}';
            const date = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[QA] Agentic Console pass rate dropped to ${rate}% (${date})`,
              body: `## ⚠️ QA Pass Rate Alert\n\n**Date:** ${date}\n**Pass Rate:** ${rate}% (threshold: 80%)\n\n**Action Required:**\n1. Check \`${PROJECT_DIR}/last-run.json\`\n2. Review QA Dashboard at \`/agentic-console/qa-dashboard\`\n3. Fix failing tests\n4. Re-run QA to verify\n\n_Auto-generated by QA Periodic workflow._`,
              labels: ['qa', 'auto-generated'],
            });
